<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HirePulse | Tech Career Discovery Platform{% endblock %}</title>

    <!-- HirePulse Favicon with Pulse Wave -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232457bd'/><rect x='5' y='9' rx='2.5' width='22' height='16' fill='white' opacity='.95'/><rect x='11' y='5' rx='1.5' width='10' height='6' fill='none' stroke='white' stroke-width='2'/><path d='M7 17h5l2-4 3 8 2.5-5 1.5 2H25' stroke='%232457bd' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>">

    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- Flash Alerts -->
    {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="tj-alerts-container">
            {% for message in messages %}
            <div class="alert alert-primary alert-dismissible fade show border-0 shadow-sm d-flex align-items-center justify-content-between m-3" role="alert">
                <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-info-circle-fill text-primary"></i>
                    <span>{{ message }}</span>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
        </div>
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
