{% extends "base.html" %}

{% block title %}Sign In | WorkLane{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="text-center mb-4">
            <span class="nav-brand-mark mx-auto mb-3" style="width: 44px; height: 44px; border-radius: 12px;">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4 6h16M4 12h10M4 18h16" stroke="#ffffeb" stroke-width="2.5" stroke-linecap="round"/>
                    <circle cx="18" cy="12" r="3" fill="#f0d7ff"/>
                </svg>
            </span>
            <h1 class="auth-title">Welcome to WorkLane</h1>
            <p class="auth-subtitle">Sign in to your candidate or recruiter chamber</p>
        </div>

        <!-- 1-Click Demo Login Pills -->
        <div class="p-3 border border-2 border-dark rounded-3 mb-4" style="background:#ffffff;">
            <div class="small fw-bold text-uppercase mb-2" style="font-size:11px; letter-spacing:1px; color:var(--color-fog);">
                <span class="ember-dot me-1"></span> Quick Demo Access (1-Click):
            </div>
            <div class="d-flex flex-wrap gap-2">
                <button type="button" class="btn-secondary-outline py-1 px-2 small" onclick="fillDemo('seeker@example.com', 'seeker123')">
                    <i class="bi bi-person me-1"></i> Job Seeker
                </button>
                <button type="button" class="btn-secondary-outline py-1 px-2 small" onclick="fillDemo('recruiter@technova.com', 'recruiter123')">
                    <i class="bi bi-building me-1"></i> Recruiter
                </button>
                <button type="button" class="btn-secondary-outline py-1 px-2 small" onclick="fillDemo('admin@worklane.com', 'admin123')">
                    <i class="bi bi-shield-lock me-1"></i> Admin
                </button>
            </div>
        </div>

        <!-- Login Form -->
        <form method="POST" action="/login">
            <div class="auth-input-group">
                <label for="email">Work or Personal Email</label>
                <div class="auth-field-wrapper">
                    <i class="bi bi-envelope auth-field-icon"></i>
                    <input type="email" id="email" name="email" class="auth-input"
                           placeholder="name@example.com" required autocomplete="email">
                </div>
            </div>

            <div class="auth-input-group">
                <label for="password">Password</label>
                <div class="auth-field-wrapper">
                    <i class="bi bi-lock auth-field-icon"></i>
                    <input type="password" id="password" name="password" class="auth-input"
                           placeholder="Enter your password" required autocomplete="current-password">
                    <button type="button" class="btn btn-sm btn-link text-muted position-absolute end-0 me-2 text-decoration-none" onclick="togglePasswordVisibility('password', this)">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-primary-cta w-100 py-3 mt-2 justify-content-center">
                Sign In to WorkLane →
            </button>

            <div class="text-center mt-4 pt-3 border-top border-2 border-dark">
                <span class="text-muted small">New to WorkLane?</span>
                <a href="/register" class="fw-bold text-dark text-decoration-underline small ms-1">
                    Create an account
                </a>
            </div>

            <div class="text-center mt-3">
                <a href="/" class="small text-muted text-decoration-none">
                    <i class="bi bi-arrow-left"></i> Back to Homepage
                </a>
            </div>
        </form>
    </div>
</div>

<script>
function fillDemo(email, pass) {
    document.getElementById('email').value = email;
    document.getElementById('password').value = pass;
}

function togglePasswordVisibility(fieldId, btn) {
    const input = document.getElementById(fieldId);
    const icon = btn.querySelector('i');
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('bi-eye');
        icon.classList.add('bi-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.remove('bi-eye-slash');
        icon.classList.add('bi-eye');
    }
}

</script>
{% endblock %}
